<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <title>City Guardian</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <main class="app">

        <div class="logo">
            🛡️
        </div>

        <h1>CITY GUARDIAN</h1>

        <p class="subtitle">
            Telemetría inteligente para tu seguridad
        </p>

        <div class="status">
            <span class="status-dot"></span>
            Sistema activo
        </div>

        <section class="card">
            <h2>Hola 👋</h2>

            <p>
                Bienvenido a City Guardian.
                Tu dispositivo está listo para comenzar.
            </p>

            <button onclick="mostrarMensaje()">
                Comenzar
            </button>

            <button class="emergency" onclick="emergencia()">
                🚨 Emergencia
            </button>
        </section>

        <p id="mensaje"></p>

    </main>

    <script src="app.js"></script>
    <script>
    if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("service-worker.js")
            .then(() => console.log("Service Worker registrado"))
            .catch(error => console.error("Error:", error));
    }
    </script>

</body>
</html>
