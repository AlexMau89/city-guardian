<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <title>City Guardian</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <main class="app">

        <!-- LOGO HEADER -->
        <div class="logo">
            🛡️
        </div>

        <h1>RUMBO SEGURO</h1>

        <p class="subtitle">
            Telemetría inteligente para tu seguridad
        </p>

        <!-- VISTA 1: LOGIN -->
        <section id="login-view" class="card view">
            <h2>Iniciar Sesión</h2>
            <p class="login-desc">Ingresa tus credenciales para iniciar el monitoreo de rutas en tiempo real.</p>

            <form id="login-form" onsubmit="iniciarSesion(event)">
                <div class="input-group">
                    <label for="usuario">Usuario / Correo</label>
                    <input type="text" id="usuario" placeholder="ej. guardian@seguridad.com" required autocomplete="username">
                </div>

                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
                </div>

                <button type="submit" class="btn-primary">
                    Ingresar al Sistema
                </button>
            </form>
        </section>

        <!-- VISTA 2: DASHBOARD (Oculta por defecto) -->
        <section id="dashboard-view" class="card view hidden">
            <div class="status">
                <span class="status-dot"></span>
                Sistema activo
            </div>

            <h2 id="bienvenida-text" style="margin-top: 15px;">Hola 👋</h2>

            <p>
                Tu dispositivo está listo para monitorear cambios de velocidad, giros y pérdida de conexión.
            </p>

            <button class="btn-primary" onclick="mostrarMensaje()">
                ▶️ Iniciar Monitoreo
            </button>

            <button class="emergency" onclick="emergencia()">
                🚨 Emergencia
            </button>

            <button class="btn-logout" onclick="cerrarSesion()">
                Cerrar Sesión
            </button>
        </section>

        <p id="mensaje"></p>

    </main>

    <script src="app.js"></script>
    <script>
    if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("service-worker.js")
            .then(() => console.log("Service Worker registrado"))
            .catch(error => console.error("Error:", error));
    }
    </script>

</body>
</html>
